spring.application.name=GestionDeEmprendimientos

server.port=8862

spring.datasource.url=${urldb}
spring.datasource.username=${usernamebd}
spring.datasource.password=${passwordbd}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
#CORS
spring.webmvc.cors.allowed-origins=*
# Configuración para el tamaño máximo del archivo cargado
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
