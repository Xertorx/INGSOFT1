<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head th:fragment="page_head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>


<nav class="navbar navbar-expand-lg "  th:fragment="page_navbar">
    <style>
        .navbar {
          background-color: #dbeddc !important;
          height : 80px
        }
        .container-fluid{
            height : 80px
        }
    </style>
    <div class="container-fluid " >
        <a class="navbar-brand" th:href="@{/}"> Home </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item mx-2">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link" href="#">Link</a>
                </li>
                <li class="nav-item dropdown mx-2">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Dropdown
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </li>
            </ul>

            <!-- Campo de búsqueda centrado -->
            <form class="d-flex mx-auto w-50" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>

            <!-- Login y Registro alineados a la derecha -->
        <ul class="navbar-nav ms-auto mb-5 mb-lg-0" th:if="${session.usuario == null}">
                <li class="nav-item mx-5 ">
                    <a class="nav-link active" aria-current="page" th:href="@{/login}">Loguearse</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link" th:href="@{/registro}">Registrarse</a>
                </li>
            </ul>

            <!-- Login y Registro alineados a la derecha -->
            <ul class="navbar-nav ms-auto mb-5 mb-lg-0" th:if="${session.usuario != null}">
                <li class="nav-item mx-5 ">
                    <a class="nav-link active" aria-current="page" th:href="@{/micuenta}">Mi cuenta</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link" th:href="@{/logout}">Cerrar Sesion</a>
                </li>
            </ul>

        </div>
    </div>
</nav>

<footer class="bg-light text-center py-3" th:fragment="page_footer">
    <p class="mb-0">&copy; <span id="current-year"></span> GSPE</p>
    <script>

        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</footer>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
