<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<html lang="en" data-bs-theme="auto">

<head th:replace="~{layoutAdmin :: page_head}">
</head>

<body >



<main class="d-flex flex-nowrap" >

    <div th:replace="~{layoutAdmin :: main}">

    </div>
    <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
        <div class="container mt-4" style="max-width: 700px;">
            <h2 class="text-dark text-center pb-5">Registrar Nuevo Plan</h2>
            <!-- Formulario -->
            <form method="post" th:action="@{/registroPlan}" th:object="${planes}" class="mt-3">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="titulo" class="form-label text-dark">Nombre del Plan</label>
                        <input type="text" class="form-control" id="titulo" th:field="*{nombrePlan}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="precio" class="form-label text-dark">Precio</label>
                        <input type="number" class="form-control" id="precio" th:field="*{precio}" step="0.01" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="descripcion" class="form-label text-dark">Descripción del Plan</label>
                        <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="4" required></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-bd-primary w-100">Registrar Plan</button>
                <div id="errorMessage" class="alert alert-danger mt-3" th:if="${errorMessage}" th:text="${errorMessage}">
                </div>
                <div id="successMessage" class="alert alert-success mt-3" th:if="${successMessage}" th:text="${successMessage}">
                </div>
            </form>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2D2iJoFEqAAtFjNC6LDtc1T5M3LmJ0LGxSlZPSh+mGS2e+9MZ4OPFZBz5d5"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const errorMessage = document.getElementById("errorMessage");
            const successMessage = document.getElementById("successMessage");

            if (errorMessage &&z errorMessage.textContent.trim() !== "") {
                errorMessage.classList.remove("d-none");
                setTimeout(() => {
                    errorMessage.classList.add("d-none");
                }, 5000);
            }

            if (successMessage && successMessage.textContent.trim() !== "") {
                successMessage.classList.remove("d-none");
                setTimeout(() => {
                    successMessage.classList.add("d-none");
                }, 5000);
            }
        });
    </script>

</main>
<footer th:replace="~{layoutAdmin :: page_footer} ">

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script th:src="@{/assets/sidebars.js}"></script>
</body>
</html>
