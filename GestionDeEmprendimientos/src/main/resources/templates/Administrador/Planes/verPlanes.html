<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<html lang="en" data-bs-theme="auto">

<head th:replace="~{layoutAdmin :: page_head}">
</head>

<body >


<main class="d-flex flex-nowrap" >

    <div th:replace="~{layoutAdmin :: main2}">

    </div>

    <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
        <div class="container mt-4" style="max-width: 800px;">
            <h2 class="text-dark text-center pb-5">Lista de Planes</h2>

            <!-- Tabla -->
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre del Plan</th>
                    <th>Precio</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="plan : ${planes}">
                    <td th:text="${plan.idPlan}">1</td>
                    <td th:text="${plan.nombrePlan}">Plan Básico</td>
                    <td th:text="${plan.precio}">$10.00</td>
                    <td th:text="${plan.descripcion}">Descripción del plan</td>
                    <td>
                        <button type="button" class="btn btn-warning btn-sm me-1"
                                data-bs-toggle="modal" data-bs-target="#editPlanModal"
                                th:data-id="${plan.idPlan}"
                                th:data-nombre="${plan.nombrePlan}"
                                th:data-precio="${plan.precio}"
                                th:data-descripcion="${plan.descripcion}">
                            Editar
                        </button>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>

        <!-- Modal para Editar Plan -->
        <div class="modal fade" id="editPlanModal" tabindex="-1" aria-labelledby="editPlanModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editPlanModalLabel">Editar Plan</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editPlanForm" th:action="@{/administrador/planes/editar}" method="post">
                            <input type="hidden" name="idPlan" id="editPlanId">
                            <div class="mb-3">
                                <label for="editNombrePlan" class="form-label">Nombre del Plan</label>
                                <input type="text" class="form-control" id="editNombrePlan" name="nombrePlan" required>
                            </div>
                            <div class="mb-3">
                                <label for="editPrecio" class="form-label">Precio</label>
                                <input type="number" class="form-control" id="editPrecio" name="precio" required>
                            </div>
                            <div class="mb-3">
                                <label for="editDescripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="editDescripcion" name="descripcion" rows="3" required></textarea>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Script para cargar datos en el modal -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var editPlanModal = document.getElementById('editPlanModal');

                editPlanModal.addEventListener('show.bs.modal', function (event) {
                    var button = event.relatedTarget; // Botón que activó el modal

                    // Obtener valores de los atributos data-*
                    var id = button.getAttribute('data-id');
                    var nombre = button.getAttribute('data-nombre');
                    var precio = button.getAttribute('data-precio');
                    var descripcion = button.getAttribute('data-descripcion');

                    // Llenar los campos del formulario
                    document.getElementById('editPlanId').value = id;
                    document.getElementById('editNombrePlan').value = nombre;
                    document.getElementById('editPrecio').value = precio;
                    document.getElementById('editDescripcion').value = descripcion;
                });
            });
        </script>


    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"></script>
</main>
<footer th:replace="~{layoutAdmin :: page_footer} ">


</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script th:src="@{/assets/sidebars.js}"></script>
</body>
</html>
