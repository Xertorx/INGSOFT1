<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<html lang="en" data-bs-theme="auto">

<head th:replace="~{layoutAdmin :: page_head}">
</head>

<body >



<main class="d-flex flex-nowrap" >

    <div th:replace="~{layoutAdmin :: main}">

    </div>
    <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1 ">
    <div class="d-flex w-50 justify-content-center pb-5">
            <!-- Botones en la parte superior -->
            <div class="d-flex justify-content-between mb-3 pt-5" >
                <button type="button" class="btn btn-primary mx-4">Botón 1</button>
                <button type="button" class="btn btn-secondary mx-4">Botón 2</button>
                <button type="button" class="btn btn-success mx-4">Botón 3</button>
            </div>
        </div>
        <div class="container mt-4 " style="max-width: 700px;">
            <h2 class="text-dark text-center pb-5">Registrar Nuevo Administrador</h2>
            <!-- Formulario -->
            <form method="post" th:action="@{/registroAdmin}" th:object="${usuario}" class="mt-3">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label text-dark">Nombres</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombres}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="apellido" class="form-label text-dark">Apellidos</label>
                        <input type="text" class="form-control" id="apellido" th:field="*{apellidos}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label text-dark">Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" th:field="*{numeroTelefono}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="tipoDocumento" class="form-label text-dark">Tipo Documento</label>
                        <select class="form-select bg-light" id="tipoDocumento" th:field="*{tipoDocumento}" required>
                            <option value="" disabled selected>Tipo de Documento</option>
                            <option value="CC">Cédula de Ciudadanía</option>
                            <option value="TI">Tarjeta de Identidad</option>
                            <option value="CE">Cédula de Extranjería</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="numeroDocumento" class="form-label text-dark">Numero de Documento</label>
                        <input type="text" class="form-control" id="numeroDocumento" th:field="*{numeroDocumento}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="fechaNacimiento" class="form-label text-dark">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="correo" class="form-label text-dark">Correo</label>
                        <input type="email" class="form-control" id="correo" th:field="*{correo}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="contrasena" class="form-label text-dark">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena" th:field="*{contrasena}" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-bd-primary w-100">Registrar</button>
                <div id="errorMessage" class="alert alert-danger mt-3 d-none" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">
                    Error al registrar el administrador.
                </div>
                <div id="successMessage" class="alert alert-success mt-3 d-none" role="alert" th:if="${successMessage}" th:text="${successMessage}">
                    Administrador registrado correctamente.
                </div>
            </form>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2D2iJoFEqAAtFjNC6LDtc1T5M3LmJ0LGxSlZPSh+mGS2e+9MZ4OPFZBz5d5"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const errorMessage = document.getElementById("errorMessage");
            const successMessage = document.getElementById("successMessage");

            if (errorMessage && errorMessage.textContent.trim() !== "") {
                errorMessage.classList.remove("d-none");
                setTimeout(() => {
                    errorMessage.classList.add("d-none");
                }, 5000);
            }

            if (successMessage && successMessage.textContent.trim() !== "") {
                successMessage.classList.remove("d-none");
                setTimeout(() => {
                    successMessage.classList.add("d-none");
                }, 5000);
            }
        });
    </script>

</main>
<footer th:replace="~{layoutAdmin :: page_footer} ">

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script th:src="@{/assets/sidebars.js}"></script>
</body>
</html>
