<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<html lang="en" data-bs-theme="auto">

<head th:replace="~{layoutAdmin :: page_head}">
</head>

<body >



<main class="d-flex flex-nowrap" >

    <div th:replace="~{layoutAdmin :: main}">

    </div>
    <!-- Centered Form Container -->
    <div class="d-flex justify-content-center align-items-center flex-grow-1">
        <div class="container mt-4" style="max-width: 500px;">
            <h2 class="text-dark text-center">Registrar Nuevo Administrador</h2>
            <form method="post" th:action="@{/registroAdmin}" class="mt-3">
                <div class="mb-3">
                    <label for="nombre" class="form-label text-dark">Nombres</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="apellido" class="form-label text-dark">Apellidos</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" required>
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label text-dark">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono" required>
                </div>
                <div class="mb-3">
                    <label for="fechaNacimiento" class="form-label text-dark">Fecha de Nacimiento</label>
                    <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label text-dark">Correo</label>
                    <input type="email" class="form-control" id="correo" name="correo" required>
                </div>
                <div class="mb-3">
                    <label for="contrasena" class="form-label text-dark">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                </div>
                <button type="submit" class="btn btn-bd-primary w-100">Registrar</button>
            </form>
        </div>
    </div>
    <div th:if="${errorMessage}" id="errorModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p th:text="${errorMessage}">Error al registrar el usuario.</p>
        </div>
    </div>

    <div th:if="${successMessage}" id="successModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p th:text="${successMessage}">Usuario registrado correctamente.</p>
        </div>
    </div>
    <script>
        window.onload = function() {
            const errorModal = document.getElementById('errorModal');
            const successModal = document.getElementById('successModal');
            if (errorModal) errorModal.style.display = 'block';
            if (successModal) successModal.style.display = 'block';
        }
    </script>


</main>
<footer th:replace="~{layoutAdmin :: page_footer} ">

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script th:src="@{/assets/sidebars.js}"></script>
</body>
</html>
