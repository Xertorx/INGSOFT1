<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<html lang="en" data-bs-theme="auto">

<head th:replace="~{layoutAdmin :: page_head}">
</head>

<body>
<main class="d-flex flex-nowrap">
    <div th:replace="~{layoutAdmin :: main2}"></div>

    <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
        <div class="container mt-4" style="max-width: 800px;">
            <h2 class="text-dark text-center pb-5">Lista de Usuarios</h2>

            <!-- Tabla -->
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                <tr>
                    <th>Número de Documento</th>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>Tipo de Documento</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Fecha de Nacimiento</th>
                    <th>Estado</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.numeroDocumento}">12345678</td>
                    <td th:text="${usuario.nombres}">Juan</td>
                    <td th:text="${usuario.apellidos}">Pérez</td>
                    <td th:text="${usuario.tipoDocumento}">Cédula</td>
                    <td th:text="${usuario.correo}">juan.perez@example.com</td>
                    <td th:text="${usuario.numeroTelefono}">+57 3001234567</td>
                    <td th:text="${#dates.format(usuario.fechaNacimiento, 'yyyy-MM-dd')}">1990-01-01</td>
                    <td th:text="${usuario.estado}">Activo</td>
                    <td th:text="${usuario.codigo_rol.rol}">Administrador</td>
                    <td>
                        <button type="button" class="btn btn-warning btn-sm me-1">
                            Editar
                        </button>
                        <button type="button" class="btn btn-danger btn-sm">
                            Eliminar
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"></script>
</main>
<footer th:replace="~{layoutAdmin :: page_footer}"></footer>
<script th:src="@{/assets/sidebars.js}"></script>
</body>
</html>
