<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="page_head">
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/x-icon" href="/static/assets/logo-vt.svg"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bootstrap Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/sidebars/">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    <link th:src="@{/assets/sidebars.css}" rel="stylesheet">

</head>
<body>
<main>
    <div>
        <style>
            .input-group-text,input-group{
                background-color: #dbeddc !important;
            }
            .nav{
              background-color: #dbeddc !important;
            }
            .btn {
                background-color: #dbeddc;

            }
            .hidden {
                display: none !important;
            }
        </style>

        <svg xmlns="http://www.w3.org/2000/svg" class="d-none" th:fragment="svg">
            <symbol id="bootstrap" viewBox="0 0 118 94">
                <title>Bootstrap</title>
                <path fill-rule="evenodd" clip-rule="evenodd"

            </symbol>
            <symbol id="home" viewBox="0 0 16 16">
                <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4H2.5z"/>
            </symbol>

                <path fill-rule="evenodd"
                      d="M0 10a8 8 0 1 1 15.547 2.661c-.442 1.253-1.845 1.602-2.932 1.25C11.309 13.488 9.475 13 8 13c-1.474 0-3.31.488-4.615.911-1.087.352-2.49.003-2.932-1.25A7.988 7.988 0 0 1 0 10zm8-7a7 7 0 0 0-6.603 9.329c.203.575.923.876 1.68.63C4.397 12.533 6.358 12 8 12s3.604.532 4.923.96c.757.245 1.477-.056 1.68-.631A7 7 0 0 0 8 3z"/>
            </symbol>
            <symbol id="table" viewBox="0 0 16 16">
                <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm15 2h-4v3h4V4zm0 4h-4v3h4V8zm0 4h-4v3h3a1 1 0 0 0 1-1v-2zm-5 3v-3H6v3h4zm-5 0v-3H1v2a1 1 0 0 0 1 1h3zm-4-4h4V8H1v3zm0-4h4V4H1v3zm5-3v3h4V4H6zm4 4H6v3h4V8z"/>
            </symbol>
            <symbol id="people-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                <path fill-rule="evenodd"
                      d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
            </symbol>
            <symbol id="grid" viewBox="0 0 16 16">
                <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zM2.5 2a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zm6.5.5A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zM1 10.5A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3zm6.5.5A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3zm1.5-.5a.5.5 0 0 0-.5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 0-.5-.5h-3z"/>

        </svg>


        <nav th:replace="~{layout :: page_navbar}"></nav>

        <div class="d-flex justify-content-start p-4 " style="margin-top: 6rem; margin-bottom: 6rem;"
             th:fragment="menu_cuenta">
            <!-- Contenedor principal -->
            <div class="d-flex flex-grow-1 justify-content-end  pe-4 me-4" style="width: 5%;">
                <div class="d-flex flex-column ms-auto flex-shrink-0 bg-body-tertiary "
                     style="width: 4.5rem;">
                    <ul class="nav nav-pills nav-flush flex-column mb-auto text-center">
                        <li class="nav-item">
                            <a th:href="@{/emprendedor/micuenta/registrar-emprendimientos}"
                               class="nav-link py-5 border-bottom rounded-0" aria-current="page" title="Home"
                               data-bs-toggle="tooltip" data-bs-placement="right" onclick="setActive(this);">
                                <svg class="bi pe-none" width="24" height="24" role="img" aria-label="Home">
                                    <use xlink:href="#home"/>
                                </svg>
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/emprendedor/micuenta/datos-personales}"
                               class="nav-link py-5 border-bottom rounded-0"
                               title="Dashboard" data-bs-toggle="tooltip"
                               data-bs-placement="right" onclick="setActive(this);">
                                <svg class="bi pe-none" width="24" height="24" role="img" aria-label="Dashboard">
                                    <use xlink:href="#speedometer2"/>
                                </svg>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link py-5 border-bottom rounded-0" title="Orders"
                               data-bs-toggle="tooltip"
                               data-bs-placement="right" onclick="setActive(this)">
                                <svg class="bi pe-none" width="24" height="24" role="img" aria-label="Orders">
                                    <use xlink:href="#table"/>
                                </svg>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link py-5 border-bottom rounded-0" title="Products"
                               data-bs-toggle="tooltip"
                               data-bs-placement="right" onclick="setActive(this)">
                                <svg class="bi pe-none" width="24" height="24" role="img" aria-label="Products">
                                    <use xlink:href="#grid"/>
                                </svg>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link py-5 border-bottom rounded-0" title="Customers"
                               data-bs-toggle="tooltip"
                               data-bs-placement="right" onclick="setActive(this)">
                                <svg class="bi pe-none" width="24" height="24" role="img" aria-label="Customers">
                                    <use xlink:href="#people-circle"/>
                                </svg>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="flex-grow-1" id="contenedor" style="width: 60%;">

                <div class="container d-flex justify-content-center " style="min-height: 100vh;">
                    <div class="w-100" style="max-width: 80%;">
                        <form id="uploadImagesForm" th:action="@{/emprendedor/micuenta/registrar-emprendimientos/imagenes-adicionales}" method="post" enctype="multipart/form-data" class="p-4 bg-light rounded shadow">
                            <!-- Título -->
                            <h2 class="text-center mt-4 fw-bold">Imágenes Ecommerce</h2>
                            <!-- Texto explicativo -->
                            <p class="text-center text-muted">Agrega imágenes adicionales para mostrarle a tus clientes</p>

                            <!-- Imagen de Banner -->
                            <div class="input-group mt-4">
                                <span class="input-group-text fw-bold">Banner</span>
                                <input type="file" class="form-control bg-light" id="bannerUpload" name="banner" accept="image/*" required />
                            </div>

                            <!-- Imagen 1 -->
                            <div class="input-group mt-3">
                                <span class="input-group-text fw-bold">Imagen 1</span>
                                <input type="file" class="form-control bg-light" id="image1Upload" name="image1" accept="image/*" required />
                            </div>

                            <!-- Imagen 2 -->
                            <div class="input-group mt-3">
                                <span class="input-group-text fw-bold">Imagen 2</span>
                                <input type="file" class="form-control bg-light" id="image2Upload" name="image2" accept="image/*" required />
                            </div>

                            <!-- Imagen 3 -->
                            <div class="input-group mt-3">
                                <span class="input-group-text fw-bold">Imagen 3</span>
                                <input type="file" class="form-control bg-light" id="image3Upload" name="image3" accept="image/*" required />
                            </div>

                            <!-- Botón de Envío -->
                            <button type="submit" class="btn btn-primary w-100 mt-4 fw-semibold shadow-sm">Subir Imágenes</button>
                        </form>
                    </div>
                </div>

            </div>

        </div>
    </div>
</main>

<!-- Modal de Confirmación Registrar -->
<div class="modal fade" id="confirmationModalRegistrar" tabindex="-1" aria-labelledby="confirmationModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmationModalLabel">Confirmar Registro Emprendimiento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                ¿Estás seguro de que deseas registrar el emprendimiento?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="submitFormRegistrar()">Confirmar</button>
            </div>
        </div>
    </div>
</div>


<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Función para aplicar la clase activa
        function setActive(element) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-success', 'bg-opacity-25');
            });
            element.classList.add('bg-success', 'bg-opacity-25');
        }
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");

        if (errorMessage && errorMessage.textContent.trim() !== "") {
            errorMessage.classList.remove("d-none");
            setTimeout(() => {
                errorMessage.classList.add("d-none");
            }, 5000);
        }

        if (successMessage && successMessage.textContent.trim() !== "") {
            successMessage.classList.remove("d-none");
            setTimeout(() => {
                successMessage.classList.add("d-none");
            }, 5000);
        }
    });
</script>
<script>
    function habilitarEdicion() {
        const inputs = document.querySelectorAll('.disabled-input');
        inputs.forEach(input => input.disabled = false);
    }
    function showConfirmationModalRegistrar() {
      const modal = new bootstrap.Modal(document.getElementById('confirmationModalRegistrar'));
      modal.show();
  }

  function submitFormRegistrar() {
      document.getElementById('datosUsuario').submit();
  }


</script>

<footer th:replace="~{layout :: page_footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
<script th:src="@{/assets/sidebars.js}"></script>

</body>
</html>
