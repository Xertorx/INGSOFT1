<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<html lang="en" data-bs-theme="auto">

<head th:replace="~{layoutAdmin :: page_head}">
</head>

<body>


<main class="d-flex flex-nowrap">

    <div th:replace="~{layoutAdmin :: main2}">

    </div>

    <div class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
        <div class="container mt-4" style="max-width: 800px;">
            <h2 class="text-dark text-center pb-5">Lista de usuarios</h2>

            <!-- Tabla -->
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                <tr>
                    <th>numero_documento</th>
                    <th>nombres</th>
                    <th>apellidos</th>
                    <th>tipo_documento</th>
                    <th>correo</th>
                    <th>numero_telefono</th>
                    <th>fecha_nacimiento</th>
                    <th>estado</th>
                    <th>rol</th>
                    <td>Acciones</td>

                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="usuarios : ${usuario}">
                      <td th:text="${usuarios.numeroDocumento}"></td>
                      <td th:text="${usuarios.nombres}"></td>
                      <td th:text="${usuarios.apellidos}"></td>
                      <td th:text="${usuarios.tipoDocumento}"></td>
                      <td th:text="${usuarios.correo}"></td>
                      <td th:text="${usuarios.numeroTelefono}"></td>
                      <td th:text="${usuarios.fechaNacimiento}"></td>
                      <td th:text="${usuarios.estado}"></td>
                      <td th:text="${usuarios.codigo_rol.rol}"></td>
                      <td>
                          <!-- Cambiar estado a "Activo" -->
                          <form th:action="@{/usuario/{numeroDocumento}/cambiar-estado(numeroDocumento=${usuarios.numeroDocumento})}" method="post" style="display: inline;">
                              <input type="hidden" name="nuevoEstado" value="Activo">
                              <button type="submit" class="btn btn-success btn-sm">Habilitar</button>
                          </form>

                          <!-- Cambiar estado a "Inactivo" -->
                          <form th:action="@{/usuario/{numeroDocumento}/cambiar-estado(numeroDocumento=${usuarios.numeroDocumento})}" method="post" style="display: inline;">
                              <input type="hidden" name="nuevoEstado" value="Inactivo">
                              <button type="submit" class="btn btn-danger btn-sm">Inhabilitar</button>
                          </form>
                      </td>
                  </tr>
                  </tbody>
              </table>
          </div>
      </div>
</main>
<footer th:replace="~{layoutAdmin :: page_footer} ">

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
<script th:src="@{/assets/sidebars.js}"></script>
</body>
</html>
