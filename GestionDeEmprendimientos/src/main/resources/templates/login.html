<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/static/assets/logo-vt.svg" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>
</head>
<body>
<style>
  .input-group-text,input-group {
      background-color: #dbeddc;
  }
  .btn {
      background-color: #dbeddc;
  }
</style>

<nav th:replace="~{layout :: page_navbar}"></nav>
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="bg-white p-5 rounded-5 text-secondary shadow" style="width: 25rem">
    <div class="d-flex justify-content-center">
      <img th:src="@{/assets/login-icon.svg}" alt="login-icon" style="height: 7rem" />
    </div>
    <div class="text-center fs-1 fw-bold">Login</div>

    <form action="#" th:action="@{/login}" method="post">
      <div class="input-group mt-4">
        <div class="input-group-text">
          <img th:src="@{/assets/username-icon.svg}" alt="username-icon" style="height: 1rem" />
        </div>
        <input class="form-control bg-light" type="text" name="correo" placeholder="Correo" required />
      </div>
      <div class="input-group mt-1">
        <div class="input-group-text">
          <img th:src="@{/assets/password-icon.svg}" alt="password-icon" style="height: 1rem" />
        </div>
        <input class="form-control bg-light" type="password" name="contrasena" placeholder="Contraseña" required />
      </div>
      <div class="d-flex justify-content-around mt-1">
        <div class="d-flex align-items-center gap-1">
          <input class="form-check-input" type="checkbox" />
          <div class="pt-1" style="font-size: 0.9rem">Remember me</div>
        </div>
        <div class="pt-1">
          <a href="#" class="text-decoration-none text-info fw-semibold fst-italic" style="font-size: 0.9rem">Forgot your password?</a>
        </div>
      </div>
      <button type="submit" class="btn text-white w-100 mt-4 fw-semibold shadow-sm">Login</button>
    </form>

    <div class="d-flex gap-1 justify-content-center mt-1">
      <div>Don't have an account?</div>
      <a href="#" class="text-decoration-none text-info fw-semibold">Register</a>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="errorModalLabel">Error de Inicio de Sesión</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <span th:text="${error}">Correo o contraseña incorrectos.</span>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  $(document).ready(function() {
      // Verifica si hay un mensaje de error
      const errorMessage = /*[[${error}]]*/ '';
      if (errorMessage) {
          // Muestra el modal
          $('#errorModal').modal('show');

          // Cierra el modal automáticamente después de 2 segundos
          setTimeout(function() {
              $('#errorModal').modal('hide');
          }, 2000);
      }
  });
</script>

<footer th:replace="~{layout :: page_footer}"></footer>
</body>
</html>
