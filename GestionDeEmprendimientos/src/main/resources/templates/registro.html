<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/logo-vt.svg" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Register Page</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
            crossorigin="anonymous"
    />
</head>

<body>
<style>
    .input-group {
        background-color: #dbeddc;
    }
    .btn {
        background-color: #dbeddc;
    }
</style>

<nav th:replace="~{layout :: page_navbar}"></nav>
<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="bg-white p-5 rounded-5 text-secondary shadow" style="width: 35rem">
        <div class="d-flex justify-content-center">
            <img th:src="@{/assets/login-icon.svg}" alt="register-icon" style="height: 7rem"/>

        </div>
        <div class="text-center fs-1 fw-bold">Register</div>

        <form th:action="@{/registro}" method="post" th:object="${usuario}" >
            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="input-group mb-3">
                        <input class="form-control bg-light" type="text" placeholder="Nombres" th:field="*{nombres}" required />
                    </div>
                    <div class="input-group mb-3">
                        <input class="form-control bg-light" type="text" placeholder="Apellidos" th:field="*{apellidos}" required />
                    </div>
                    <div class="input-group mb-3">
                        <input class="form-control bg-light" type="email" placeholder="Correo Electrónico" th:field="*{correo}" required />
                    </div>
                    <div class="input-group mb-3">
                        <select class="form-select bg-light" th:field="*{tipoDocumento}" required>
                            <option value="" disabled selected>Tipo de Documento</option>
                            <option value="CC">Cédula de Ciudadanía</option>
                            <option value="TI">Tarjeta de Identidad</option>
                            <option value="CE">Cédula de Extranjería</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group mb-3">
                        <input class="form-control bg-light" type="text" placeholder="Número de Documento" th:field="*{numeroDocumento}" required />
                    </div>
                    <div class="input-group mb-3">
                        <input class="form-control bg-light" type="tel" placeholder="Número de Teléfono" th:field="*{numeroTelefono}" required />
                    </div>
                    <div class="input-group mb-3">
                        <input class="form-control bg-light" type="password" placeholder="Contraseña" th:field="*{contrasena}" required />
                    </div>
                    <div class="input-group mb-3">
                        <input class="form-control bg-light" type="date" placeholder="Fecha de Nacimiento" th:field="*{fechaNacimiento}" required />
                    </div>
                </div>
            </div>

            <button class="btn text-white w-100 mt-4 fw-semibold shadow-sm" type="submit">Register</button>
        </form>

        <div class="d-flex gap-1 justify-content-center mt-1">
            <div>Already have an account?</div>
            <a href="#" class="text-decoration-none text-info fw-semibold">Login</a>
        </div>
        <div class="modal-body">
            <span th:text="${error}">Error al registrar el Usuario.</span>
        </div>
    </div>

</div>
<footer th:replace="~{layout :: page_footer}"></footer>
</body>
</html>
